<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Srangam — Histories of the Indian Ocean World</title>
    <meta name="description" content="Exploring the interconnected histories of the Indian Ocean through archaeology, epigraphy, and deep time" data-rh="true" />
    <meta name="author" content="Srangam Project" />
    
    <!-- SEO-GSC-2026-10-22: the static canonical to the homepage is REMOVED. It shipped on every route next to
         the page's own Helmet canonical, so every article carried two conflicting canonicals (Google ignores
         both, or folds the page into the homepage). Each page sets its own canonical via react-helmet-async
         (Home.tsx, ArticleHead.tsx, ...). Same rule as nartiang.org's index.html. Do not add it back. -->
    
    <!-- Google Search Console Verification (replace with actual code after setup) -->
    <!-- <meta name="google-site-verification" content="YOUR_VERIFICATION_CODE" /> -->
    
    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/brand/srangam_mark_simple.svg" />
    <link rel="alternate icon" type="image/png" sizes="32x32" href="/brand/srangam_favicon_32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/srangam_favicon_180.png" />
    <link rel="manifest" href="/brand/site.webmanifest" />
    
    <!-- LCP: preload hero image used on the homepage above-the-fold (Phase 6c).
         Phase 1.2 (2026-07-12): points at the WebP variant (172 KB vs 2.7 MB PNG).
         type="image/webp" makes non-WebP browsers skip this preload and fall
         back to the <picture> PNG source at render time. -->
    <!-- LOAD_W8_2026_10_07: the hero is on the home page only, so only the home page preloads it (it was
         172 KB at high priority on every route, ahead of the scripts). Same link as before. -->
    <script>
      (function () {
        var p = location.pathname;
        if (p !== '/' && p !== '/index.html') return;
        var l = document.createElement('link');
        l.rel = 'preload'; l.as = 'image'; l.type = 'image/webp'; l.href = '/images/hero_indian-ocean_aerial_21x9_v1.webp';
        l.setAttribute('fetchpriority', 'high');
        document.head.appendChild(l);
      })();
    </script>

    <!-- Fonts -->

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Indian Language Fonts (deferred - not needed for first paint) -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Tamil:wght@300;400;500;600;700&family=Noto+Sans+Telugu:wght@300;400;500;600;700&family=Noto+Sans+Kannada:wght@300;400;500;600;700&family=Noto+Sans+Bengali:wght@300;400;500;600;700&family=Noto+Serif+Devanagari:wght@300;400;500;600;700&family=Noto+Sans+Gurmukhi:wght@300;400;500;600;700&family=Noto+Serif+Bengali:wght@300;400;500;600;700&display=swap">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Tamil:wght@300;400;500;600;700&family=Noto+Sans+Telugu:wght@300;400;500;600;700&family=Noto+Sans+Kannada:wght@300;400;500;600;700&family=Noto+Sans+Bengali:wght@300;400;500;600;700&family=Noto+Serif+Devanagari:wght@300;400;500;600;700&family=Noto+Sans+Gurmukhi:wght@300;400;500;600;700&family=Noto+Serif+Bengali:wght@300;400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    
    <!-- Ancient Script Fonts for Epigraphy (lazy-loaded) -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Brahmi&family=Noto+Sans+Grantha&family=Noto+Sans+Kawi&family=Noto+Sans+Cham&display=swap" rel="stylesheet" media="print" onload="this.media='all'">

    <!-- Open Graph -->
    <!-- SEO-GSC-2026-10-22: data-rh="true" lets react-helmet-async replace these fallbacks when a page sets its own;
         without it the rendered page carried two descriptions / og:titles, the homepage's first. og:url removed:
         a static og:url named the homepage on every shared article (ArticleHead and Home set their own). -->
    <meta property="og:title" content="Srangam — Histories of the Indian Ocean World" data-rh="true" />
    <meta property="og:description" content="Dharmic Scholarship for the Digital Age — Exploring the interconnected histories of the Indian Ocean through archaeology, epigraphy, and deep time" data-rh="true" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://srangam.nartiang.org/brand/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:site_name" content="Srangam" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Srangam — Histories of the Indian Ocean World" data-rh="true" />
    <meta name="twitter:description" content="Dharmic Scholarship for the Digital Age — Exploring the interconnected histories of the Indian Ocean" data-rh="true" />
    <meta name="twitter:image" content="https://srangam.nartiang.org/brand/og-image.png" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
